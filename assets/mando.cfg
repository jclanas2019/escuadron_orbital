# Asignación del mando de juego (gamepad) para ESCUADRÓN ORBITAL.
#
# Una acción por línea:  accion = entrada [entrada ...]
# Los nombres de botón son los de Bevy y siguen la POSICIÓN, no la letra
# impresa: South es el botón de abajo (✕ en PS5, B en Nintendo, A en Xbox),
# East el de la derecha (○ / A / B), North el de arriba (△ / X / Y) y West
# el de la izquierda (□ / Y / X).
#
#   Botones: South East North West LeftTrigger (L1/L/LB) RightTrigger (R1/R/RB)
#            LeftTrigger2 (L2/ZL/LT) RightTrigger2 (R2/ZR/RT) Select (CREATE/−)
#            Start (OPTIONS/+) Mode (PS/HOME) LeftThumb (L3) RightThumb (R3)
#            DPadUp DPadDown DPadLeft DPadRight y OtroN para botones no estándar
#            (N lo muestra la prueba del mando, tecla F6)
#   Ejes:    LeftStickX+ LeftStickX- LeftStickY+ (arriba) LeftStickY- (abajo)
#            RightStickX+ RightStickX- RightStickY+ RightStickY- LeftZ+ RightZ+
#            y EjeN+ / EjeN- para ejes no estándar
#
# Las líneas vacías dejan la acción sin asignar.
#
# Si tu mando envía otros nombres (OtroN, EjeN) o se mueve solo, no edites este
# archivo: pulsa F7 en el juego y el asistente te pide cada control, lo mide y guarda
# un perfil de ese mando en assets/mandos/ (se carga solo cada vez que lo conectas).

# Diseño de los nombres que se muestran en pantalla:
#   auto (se detecta por el fabricante) | nintendo | ps5 | xbox      (F8 lo cambia)
diseño            = auto

# Algunos controladores de Nintendo informan los botones por la LETRA y no por la
# posición (el A de Nintendo llega como South). Si en tu mando A y B salen al revés,
# pon "sí" aquí (también cambia X e Y).
intercambiar_ab   = no

# --- vuelo (analógico)
cabecear_arriba   = LeftStickY+
cabecear_abajo    = LeftStickY-
alabear_izquierda = LeftStickX-
alabear_derecha   = LeftStickX+
guinar_izquierda  = RightStickX-
guinar_derecha    = RightStickX+
acelerar          = RightTrigger2
frenar            = LeftTrigger2
turbo             = RightTrigger

# --- armas
disparar          = South
misil             = East
racimo            = West
transformar       = North

# --- cámara y sistema
camara            = LeftTrigger DPadRight
cortes            = RightThumb DPadLeft
invertir_y        = LeftThumb
ayuda             = Select DPadUp
musica            = DPadDown
pausa             = Start

# En la pantalla de título: Start / South empieza, cruceta ← → elige la dificultad.
# Derribado: Start o South vuelve a despegar.

# Inclinación que cuenta como pulsación (0.3 a 0.9). Se suelta por debajo
# del 60 % de este valor, así el ruido de un stick no repite la acción.
umbral            = 0.5
# Zona muerta de los sticks (0 a 0.5) y curva de respuesta (1 = lineal, 2 = suave al centro).
zona_muerta       = 0.12
curva             = 1.6
# Fuerza de la vibración (0 = apagada, 1 = máxima).
vibracion         = 1.0
