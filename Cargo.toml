[package]
name = "nave_combate"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = { version = "0.20.1", features = ["wav", "vorbis", "jpeg", "png"] }
rand = "0.8"
# Mandos por SDL2 (recomendado en macOS: Switch Pro, Xbox y DualSense por Bluetooth).
# start.sh lo activa solo si encuentra SDL2 (brew install sdl2).
sdl2 = { version = "0.38", optional = true }

[features]
sdl = ["dep:sdl2"]

[profile.dev]
opt-level = 1
[profile.dev.package."*"]
opt-level = 3
[profile.release]
codegen-units = 16
